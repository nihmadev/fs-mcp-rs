# Copy this file to a location you control, edit every value you need,
# and start the server with: fs-mcp-rs --config PATH_TO_YOUR_CONFIG
# Relative roots are resolved from the directory containing this file.

[server]
host = "127.0.0.1"
port = 8000
max_concurrency = 32
max_io_concurrency = 16
log_tools = true

[filesystem]
roots = [".."]
read_only = false
max_read_bytes = 8388608
max_write_bytes = 8388608
follow_links = false
# list_tree server bounds
tree_max_depth = 8
tree_max_entries = 1000
tree_max_warnings = 32
# apply_patch request and preview bounds
patch_max_bytes = 1048576
patch_preview_bytes = 16384

[search]
max_results = 1000
max_concurrency = 4
worker_threads = 4
regex_cache_capacity = 64
include_hidden = false
respect_gitignore = true

# WARNING: permits arbitrary commands with the server process permissions.
[terminal]
enabled = true
max_concurrency = 2
default_timeout_ms = 30000
max_timeout_ms = 300000
max_output_bytes = 4194304
# Maximum output returned by one terminal_read call.
max_read_bytes = 262144
# Maximum long-poll duration accepted by terminal_read.
max_wait_ms = 30000
# Keep completed sessions available for this long.
session_retention_ms = 300000

[oauth]
# Enables OAuth 2.0 / OpenID Connect metadata discovery and flow endpoints
enabled = true
# Require Bearer token authentication for /mcp requests
require_auth = false

